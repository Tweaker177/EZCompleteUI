# This endpoint is opened by unauthenticated email links and then hands the
# one-time Supabase session tokens to the app. It must remain public.
[functions.password-reset-redirect]
enabled = true
verify_jwt = false
entrypoint = "./functions/password-reset-redirect/index.ts"

[functions.recover-user-images]
enabled = true
verify_jwt = true
entrypoint = "./functions/recover-user-images/index.ts"

# Claims the one-time welcome coins/spins after authentication. Keeping JWT
# verification on is essential: the function derives the account from it and
# records the proxy-provided request IP for the anti-abuse gate.
[functions.claim-welcome-bonus]
enabled = true
verify_jwt = true
entrypoint = "./functions/claim-welcome-bonus/index.ts"

